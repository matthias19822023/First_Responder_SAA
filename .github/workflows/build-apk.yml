      - name: Diagnose Android Gradle
        run: |
          echo "=== Projektdateien ==="
          pwd
          ls -la
          ls -la app

          echo "=== Gradle Projekte ==="
          gradle --no-daemon projects

          echo "=== Gradle Aufgaben ==="
          gradle --no-daemon :app:tasks --all

          echo "=== Android Plugin ==="
          cat app/build.gradle

      - name: Build Debug APK
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug
